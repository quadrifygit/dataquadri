  function getByEval(name){
    try { return eval(name); } catch(e) { return null; }

  function escapeHtml(value){
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function normalizeText(value){
    let text = String(value == null ? '' : value)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/º|ª/g, ' ')
      .replace(/[^a-z0-9]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    const aliases = {
      av:'avenida', r:'rua', rod:'rodovia', estr:'estrada', est:'estrada',
      tv:'travessa', trv:'travessa', al:'alameda', pc:'praca', pca:'praca', ld:'largo'
    };
    return text.split(' ').filter(Boolean).map(t => aliases[t] || t).join(' ');
  }

  function coreText(value){
    const generic = new Set([
      'rua','avenida','travessa','alameda','rodovia','estrada','praca','largo',
      'viela','via','marginal','acesso','corredor','passagem','caminho','servidao'
    ]);
    const normalized = normalizeText(value);
    const tokens = normalized.split(' ').filter(t => t && !generic.has(t));
    return tokens.join(' ') || normalized;
  }

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

    } catch(e) {

    }
  }

  function saveState(obj){

  }

  function styleForLabel(label){
    const c = COLORS[label] || COLORS.NONE;
    if(label === 'NONE'){
      return {
        fillColor:c.fill,
        color:'#000000',
        weight:2.6,
        fillOpacity:0.15,
        opacity:1.0
      };
    }
    return {
      fillColor:c.fill,
      color:'#000000',
      weight:2.8,
      fillOpacity:0.80,
      opacity:1.0
    };
  }

  function applyAllSectorLabels(){

        const id = props._qid != null ? String(props._qid) : null;
        const label = id && state[id] ? state[id] : 'NONE';
        layer.setStyle(styleForLabel(label));
      } catch(e) {}
    });
  }

          <button class="qrfy-btn" style="background:#000000" data-act="NEUTRO" data-fid="${escapeHtml(id)}">NEUTRO</button>
          <button class="qrfy-btn" style="background:#d73027" data-act="RUIM" data-fid="${escapeHtml(id)}">RUIM</button>

  function attachSectorEvents(){
    applyAllSectorLabels();

    sectorsGeo.eachLayer(layer => {
      layer.on('mouseover', () => {
        try { layer.setStyle({weight:3.4}); } catch(e) {}
      });

      layer.on('mouseout', () => {
        try {
          const props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
          const id = props._qid != null ? String(props._qid) : null;
          const state = loadState();
          const label = id && state[id] ? state[id] : 'NONE';
          layer.setStyle(styleForLabel(label));
        } catch(e) {}
      });

      layer.on('click', event => {
        try {
          const props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
          const id = props._qid != null ? String(props._qid) : null;
          if(!id) return;

          const state = loadState();
          const current = state[id] || 'NONE';
          layer.bindPopup(sectorPopupHtml(id, props, current), {
            maxWidth:340,
            autoPan:true,
            closeButton:true
          });
          layer.openPopup(event && event.latlng ? event.latlng : undefined);

          window.setTimeout(() => {
            const popupObj = layer.getPopup ? layer.getPopup() : null;
            const popupElement = popupObj && popupObj.getElement ? popupObj.getElement() : null;
            const content = popupElement
              ? popupElement.querySelector('.leaflet-popup-content')
              : null;
            if(!content) return;

            content.querySelectorAll('button[data-act][data-fid]').forEach(button => {
              button.onclick = clickEvent => {
                try {
                  if(clickEvent){
                    clickEvent.preventDefault();
                    clickEvent.stopPropagation();
                  }
                } catch(e) {}

                const action = button.getAttribute('data-act');
                const sectorId = button.getAttribute('data-fid');
                if(!sectorId) return;

                const nextState = loadState();
                if(action === 'NONE') delete nextState[sectorId];
                else nextState[sectorId] = action;
                saveState(nextState);
                layer.setStyle(styleForLabel(action));
                try { layer.closePopup(); } catch(e) {}
              };
            });
          }, 40);
        } catch(e) {
          console.error('Erro ao abrir editor do setor:', e);
        }
      });
    });
  }

  function boundedLevenshtein(a, b, maxDistance){
    a = String(a || '');
    b = String(b || '');
    if(Math.abs(a.length - b.length) > maxDistance) return maxDistance + 1;
    if(a === b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;

    let previous = new Array(b.length + 1);
    for(let j=0; j<=b.length; j++) previous[j] = j;

    for(let i=1; i<=a.length; i++){
      const current = [i];
      let rowMin = current[0];
      const ca = a.charAt(i - 1);
      for(let j=1; j<=b.length; j++){
        const cost = ca === b.charAt(j - 1) ? 0 : 1;
        const value = Math.min(
          current[j - 1] + 1,
          previous[j] + 1,
          previous[j - 1] + cost
        );
        current[j] = value;
        if(value < rowMin) rowMin = value;
      }
      if(rowMin > maxDistance) return maxDistance + 1;
      previous = current;
    }
    return previous[b.length];
  }

  function fuzzyWordDistance(query, candidate, maxDistance){
    let best = maxDistance + 1;
    const words = String(candidate || '').split(' ').filter(Boolean);
    const options = [candidate].concat(words);
    options.forEach(option => {
      if(Math.abs(option.length - query.length) <= maxDistance){
        best = Math.min(best, boundedLevenshtein(query, option, maxDistance));
      }
    });
    return best;
  }

  function scoreStreet(item, rawQuery){
    const query = normalizeText(rawQuery);
    const coreQuery = coreText(rawQuery);
    if(!query) return null;

    const full = item.search;
    const core = item.core;
    const q = query;
    const qc = coreQuery;

    if(full === q) return 0;
    if(core === qc) return 1;
    if(full.startsWith(q)) return 10 + Math.min(20, full.length - q.length);
    if(core.startsWith(qc)) return 18 + Math.min(20, core.length - qc.length);
    if(full.includes(q)) return 35 + full.indexOf(q);
    if(core.includes(qc)) return 42 + core.indexOf(qc);

    const tokens = qc.split(' ').filter(Boolean);
    if(tokens.length && tokens.every(token => core.includes(token))) return 55;

    if(qc.length >= 4){
      const maxDistance = qc.length <= 6 ? 1 : 2;
      const distance = fuzzyWordDistance(qc, core, maxDistance);
      if(distance <= maxDistance) return 75 + distance * 5;
    }
    return null;
  }

  function searchStreets(rawQuery){
    const results = [];
    streetIndex.forEach(item => {
      const score = scoreStreet(item, rawQuery);
      if(score != null) results.push({item, score});

    results.sort((a, b) => {
      if(a.score !== b.score) return a.score - b.score;
      return a.item.name.localeCompare(b.item.name, 'pt-BR');

    return results.slice(0, CONFIG.maxSuggestions || 10).map(result => result.item);

  }

  function highlightIntersectedSectors(sectorIds){
    if(!CONFIG.highlightSectors || !Array.isArray(sectorIds) || !sectorIds.length) return;
    const wanted = new Set(sectorIds.map(String));
    sectorStreetHighlight = L.layerGroup().addTo(mapObj);

    sectorsGeo.eachLayer(layer => {
      try {
        const props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
        const id = props._qid != null ? String(props._qid) : null;
        if(!id || !wanted.has(id)) return;
        L.geoJSON(layer.toGeoJSON(), {
          pane:'qrfySectorStreetHighlightPane',
          interactive:false,
          style:() => ({
            fillOpacity:0,
            color:'#facc15',
            weight:5,
            opacity:1,
            dashArray:'8 5',
            lineCap:'round',
            lineJoin:'round'
          })
        }).addTo(sectorStreetHighlight);
      } catch(e) {}
    });
  }

  function showSelectedPanel(feature){
    const props = streetProperties(feature);
    const name = streetName(feature);
    const segments = Number(props._segment_count || 0);
    const sectorIds = Array.isArray(props._sector_ids) ? props._sector_ids : [];
    const panel = document.getElementById('qrfy-selected-street');
    if(!panel) return;

    panel.style.display = 'block';
    panel.innerHTML = `
      <strong>${escapeHtml(name)}</strong><br/>
      ${segments} trecho(s) OSM · ${sectorIds.length} setor(es) atravessado(s)<br/>
      <button type="button" id="qrfy-clear-highlight">Limpar destaque</button>
    `;
    const clearButton = document.getElementById('qrfy-clear-highlight');
    if(clearButton) clearButton.onclick = clearStreetHighlight;
  }

  function selectStreet(id, fitBounds){
    clearStreetHighlight();
    const layer = streetLayerById[String(id)];
    if(!layer || !layer.feature) return;

    selectedStreetId = String(id);
    const feature = layer.feature;
    const props = streetProperties(feature);

    streetCasing = L.geoJSON(feature, {
      pane:'qrfyStreetHighlightPane',
      interactive:false,
      style:() => ({
        color:'#111827',
        weight:9,
        opacity:.98,
        lineCap:'round',
        lineJoin:'round'
      })
    }).addTo(mapObj);

    streetHighlight = L.geoJSON(feature, {
      pane:'qrfyStreetHighlightPane',
      interactive:false,
      style:() => ({
        color:'#facc15',
        weight:5,
        opacity:1,
        lineCap:'round',
        lineJoin:'round'
      })
    }).addTo(mapObj);

    highlightIntersectedSectors(props._sector_ids || []);
    showSelectedPanel(feature);

    if(fitBounds){
      try {
        const bounds = streetHighlight.getBounds();
        if(bounds && bounds.isValid()) mapObj.fitBounds(bounds.pad(.16), {maxZoom:17});
      } catch(e) {}
    }
  }

  function setStreetsVisible(visible){
    if(visible){
      if(streetVisual && !mapObj.hasLayer(streetVisual)) streetVisual.addTo(mapObj);
      if(streetHit && !mapObj.hasLayer(streetHit)) streetHit.addTo(mapObj);
    } else {
      if(streetVisual && mapObj.hasLayer(streetVisual)) mapObj.removeLayer(streetVisual);
      if(streetHit && mapObj.hasLayer(streetHit)) mapObj.removeLayer(streetHit);
      clearStreetHighlight();
    }
  }

  function closeSuggestions(){
    const box = document.getElementById('qrfy-suggestions');
    if(box){
      box.style.display = 'none';
      box.innerHTML = '';
    }
    activeSuggestion = -1;
    currentSuggestions = [];
  }

  function renderSuggestions(items){
    const box = document.getElementById('qrfy-suggestions');
    if(!box) return;
    currentSuggestions = items || [];
    activeSuggestion = -1;

    if(!currentSuggestions.length){
      box.innerHTML = '<div class="qrfy-empty">Nenhuma rua parecida foi encontrada.</div>';
      box.style.display = 'block';
      return;
    }

    box.innerHTML = currentSuggestions.map((item, index) => `
      <div class="qrfy-suggestion" data-index="${index}" data-id="${escapeHtml(item.id)}">
        <div class="qrfy-suggestion-name">${escapeHtml(item.name)}</div>
        <div class="qrfy-suggestion-meta">${item.segments} trecho(s) · ${item.sectors} setor(es)</div>
      </div>
    `).join('');
    box.style.display = 'block';

    box.querySelectorAll('.qrfy-suggestion').forEach(element => {
      element.onmousedown = event => {
        event.preventDefault();
        const id = element.getAttribute('data-id');
        const index = Number(element.getAttribute('data-index'));
        const item = currentSuggestions[index];
        const input = document.getElementById('qrfy-street-input');
        if(input && item) input.value = item.name;
        closeSuggestions();
        selectStreet(id, true);
      };
    });
  }

  function updateActiveSuggestion(nextIndex){
    const box = document.getElementById('qrfy-suggestions');
    if(!box || !currentSuggestions.length) return;
    const elements = Array.from(box.querySelectorAll('.qrfy-suggestion'));
    if(!elements.length) return;

    activeSuggestion = Math.max(0, Math.min(nextIndex, elements.length - 1));
    elements.forEach((element, index) => {
      element.classList.toggle('active', index === activeSuggestion);
    });
    elements[activeSuggestion].scrollIntoView({block:'nearest'});
  }

  function createSearchControl(){
    const container = document.createElement('div');
    container.className = 'qrfy-street-search';
    container.innerHTML = `
      <div class="qrfy-search-row">
        <input id="qrfy-street-input" class="qrfy-search-input" type="text"
               autocomplete="off" placeholder="Pesquisar rua, avenida, rodovia..." />
        <button id="qrfy-clear-search" class="qrfy-clear-btn" type="button" title="Limpar">×</button>
      </div>
      <div id="qrfy-suggestions" class="qrfy-suggestions"></div>
      <div class="qrfy-search-footer">
        <span>${streetIndex.length} rua(s) pesquisável(is)</span>
        <label class="qrfy-toggle">
          <input id="qrfy-toggle-streets" type="checkbox" checked /> Mostrar ruas
        </label>
      </div>
      <div id="qrfy-selected-street" class="qrfy-selected"></div>
    `;

    mapObj.getContainer().appendChild(container);
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    const input = document.getElementById('qrfy-street-input');
    const clear = document.getElementById('qrfy-clear-search');
    const toggle = document.getElementById('qrfy-toggle-streets');

    if(!streetIndex.length){
      input.disabled = true;
      input.placeholder = 'Nenhuma rua com nome disponível';
    }

    input.addEventListener('input', () => {
      window.clearTimeout(searchTimer);
      const value = input.value.trim();
      if(!value){
        closeSuggestions();
        return;
      }
      searchTimer = window.setTimeout(() => {
        renderSuggestions(searchStreets(value));
      }, 90);
    });

    input.addEventListener('keydown', event => {
      if(event.key === 'ArrowDown'){
        event.preventDefault();
        updateActiveSuggestion(activeSuggestion + 1);
      } else if(event.key === 'ArrowUp'){
        event.preventDefault();
        updateActiveSuggestion(activeSuggestion <= 0 ? 0 : activeSuggestion - 1);
      } else if(event.key === 'Enter'){
        event.preventDefault();
        let item = null;
        if(activeSuggestion >= 0 && currentSuggestions[activeSuggestion]){
          item = currentSuggestions[activeSuggestion];
        } else if(currentSuggestions.length){
          item = currentSuggestions[0];
        } else {
          const found = searchStreets(input.value);
          if(found.length) item = found[0];
        }
        if(item){
          input.value = item.name;
          closeSuggestions();
          selectStreet(item.id, true);
        }
      } else if(event.key === 'Escape'){
        closeSuggestions();
      }
    });

    clear.onclick = () => {
      input.value = '';
      closeSuggestions();
      clearStreetHighlight();
      input.focus();
    };

    toggle.onchange = () => setStreetsVisible(toggle.checked);

    document.addEventListener('click', event => {
      if(!container.contains(event.target)) closeSuggestions();
    });
  }

  function boot(){
    mapObj = getByEval(MAP_NAME);
    sectorsGeo = getByEval(SECTOR_GEO_NAME);
    if(!mapObj || !sectorsGeo){
      window.setTimeout(boot, 180);
      return;
    }

    attachSectorEvents();
    createStreetLayers();
    createSearchControl();
  }

  boot();
})();
</script>
